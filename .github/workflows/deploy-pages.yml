# Build the Vite app and publish it to GitHub Pages on every push to main.
#
# Pages is enabled automatically on the first run (see configure-pages below).
# The site is served at https://echoless-tech.github.io/PLEXUS/ — hence
# VITE_BASE_PATH below. Change it if the repo is renamed or given a custom domain.

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never run two deploys at once; let an in-flight deploy finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        env:
          VITE_BASE_PATH: /PLEXUS/
        run: npm run build

      # enablement: true turns Pages on with the "GitHub Actions" source the
      # first time this runs, so no manual Settings → Pages step is needed.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
