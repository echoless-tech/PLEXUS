# Build the Vite app on every push to main and publish the built site to the
# `master` branch, which GitHub Pages serves (Settings → Pages → Deploy from a
# branch → master / root).
#
# Why not the "GitHub Actions" Pages source? That requires repo-admin to enable
# and an admin-scoped token to create the Pages site. This approach needs only
# `contents: write`, so it works on a transferred repo without extra setup.
#
# The site is served at https://echoless-tech.github.io/PLEXUS/ — hence
# VITE_BASE_PATH. `master` holds only build output; source of truth is `main`.
# If you later switch Pages to the "GitHub Actions" source, replace this file
# with the official upload-pages-artifact / deploy-pages actions.

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        env:
          VITE_BASE_PATH: /PLEXUS/
        run: npm run build

      - name: Publish build to master (Pages branch)
        run: |
          touch build/.nojekyll
          cd build
          git init -q -b master
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "deploy: ${{ github.sha }}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" master
