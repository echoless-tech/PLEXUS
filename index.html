    <script>
      // Counterpart to public/404.html: if GitHub Pages bounced a deep link
      // here as ?p=/route, put the real path back before the app mounts.
      (function () {
        var l = window.location;
        if (l.search.indexOf('?p=') !== 0 && l.search.indexOf('?p=/') !== 0) return;
        var q = {};
        l.search.slice(1).split('&').forEach(function (kv) {
          var i = kv.indexOf('=');
          q[kv.slice(0, i)] = decodeURIComponent(kv.slice(i + 1)).replace(/~and~/g, '&');
        });
        var base = l.pathname.replace(/\/$/, '');
        window.history.replaceState(null, '', base + (q.p || '/') + (q.q ? '?' + q.q : '') + l.hash);
      })();
    </script>
